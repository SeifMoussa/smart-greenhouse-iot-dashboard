name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch cancels in-flight runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Backend: ruff lint, ruff format check, pytest with coverage gate
  # ---------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest with coverage (fail under 70 %)
        run: pytest --cov=greenhouse --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Frontend: eslint, prettier, tsc, vitest, vite build
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Upload built dist as artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-node-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------
  # Docs consistency: relative links, make targets, npm scripts, API routes
  # ---------------------------------------------------------------------
  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (so the API↔docs check can import it)
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Run docs consistency check
        run: python3 scripts/check-docs.py

  # ---------------------------------------------------------------------
  # Docker smoke: build the full stack and exercise the verifier script.
  # Runs on workflow_dispatch and on pushes to main. Skipped on PRs to
  # keep PR feedback fast and to avoid pulling images on every push.
  # ---------------------------------------------------------------------
  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run end-to-end Docker verifier
        run: |
          chmod +x scripts/verify-docker.sh
          ./scripts/verify-docker.sh

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose-logs.txt || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7
