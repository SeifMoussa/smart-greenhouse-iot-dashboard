server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck endpoint used by the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache hashed asset bundles aggressively. Vite emits content-hashed
    # filenames (e.g. /assets/index-DHsq5UQC.js), so this is safe.
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not cache the entrypoint; otherwise users would be pinned to a
    # stale shell after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app fallback: any unmatched route serves index.html so
    # client-side routing works on direct navigation / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable security defaults for a static asset host.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip for text-y assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
