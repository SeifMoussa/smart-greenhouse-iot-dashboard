# =====================================================================
# Smart Greenhouse IoT Dashboard — Docker Compose
# =====================================================================
# One-command demo:
#
#     docker compose up --build
#
# Then open http://localhost:5173 in your browser. The backend is on
# http://localhost:8000 and the simulator pushes synthetic readings into
# the backend over the internal `greenhouse-net` network.
#
# The frontend is built as a static bundle and served by nginx. Because
# the browser runs on the host (not inside Docker), VITE_API_BASE_URL
# and VITE_WS_URL must point at localhost — not at the `backend` service
# hostname.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: greenhouse-backend:0.1.0
    container_name: greenhouse-backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: sqlite:////app/data/greenhouse.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      INGEST_RATE_LIMIT_PER_SECOND: 50
      MAX_WS_CONNECTIONS: 100
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # Set GREENHOUSE_API_KEY to require X-API-Key on writes.
      GREENHOUSE_API_KEY: ""
    ports:
      - "8000:8000"
    volumes:
      - greenhouse-data:/app/data
    networks:
      - greenhouse-net
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: greenhouse-backend:0.1.0
    container_name: greenhouse-simulator
    # Reuse the backend image but run the simulator entrypoint.
    command:
      ["python", "-m", "greenhouse.simulator"]
    environment:
      SIMULATOR_BACKEND_URL: http://backend:8000
      SIMULATOR_INTERVAL_SECONDS: "5"
      SIMULATOR_SENSOR_ID: esp32-sim-01
      SIMULATOR_INITIAL_BACKOFF_SECONDS: "2"
      SIMULATOR_MAX_BACKOFF_SECONDS: "30"
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      # Match GREENHOUSE_API_KEY on backend if you set it.
      SIMULATOR_API_KEY: ""
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - greenhouse-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing URLs. Browser does NOT use the internal docker
        # hostname — it runs on the host and talks to localhost.
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws
    image: greenhouse-frontend:0.1.0
    container_name: greenhouse-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - greenhouse-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  greenhouse-net:
    driver: bridge

volumes:
  greenhouse-data:
    driver: local
